services:
  db:
    image: postgis/postgis:17-3.5
    environment: {POSTGRES_DB: aeroinfo, POSTGRES_USER: aeroinfo, POSTGRES_PASSWORD: aeroinfo}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    depends_on: [db]
volumes: {pgdata: {}}
